name: Keep Render Alive

on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Check backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: https://ghostforms-ghostsx777.onrender.com/api/health
    steps:
      - name: Send GET request
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4; do
          echo "Attempt $attempt/4 — $(date -u +%FT%TZ)"
          curl_exit=0
          status_code=$(curl \
            --silent \
            --show-error \
            --request GET \
            --header 'Cache-Control: no-cache' \
            --header 'Pragma: no-cache' \
            --connect-timeout 10 \
            --max-time 15 \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$HEALTH_URL") || curl_exit=$?

          echo "HTTP status: ${status_code:-000}"

          if [[ "$curl_exit" -eq 0 && "$status_code" == '200' ]]; then
            echo "Backend healthy."
            exit 0
          fi
          retryable=false
          if [[ "$curl_exit" -ne 0 ]]; then retryable=true; fi
          case "$status_code" in 408|429|500|502|503|504) retryable=true ;; esac
          if [[ "$attempt" -lt 4 && "$retryable" == true ]]; then
            echo "Temporary failure; retrying in 5 seconds."
            sleep 5
            continue
          fi
          echo "::error::Health check failed: HTTP ${status_code:-000}, curl exit $curl_exit, attempt $attempt/4."
          if [[ "$curl_exit" -ne 0 ]]; then exit "$curl_exit"; fi
          exit 1
          done
