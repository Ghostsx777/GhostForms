services:
  - type: web
    name: ghostforms-ghostsx777
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/Ghostsx777/GhostForms
    branch: main
    buildCommand: npm ci --include=dev && npm run build:cloud
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "false"
